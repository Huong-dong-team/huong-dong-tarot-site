<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="sun-grad" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="35%" stop-color="#E52B2B"/>
      <stop offset="75%" stop-color="#C61A1A"/>
      <stop offset="100%" stop-color="#9E0C0C"/>
    </radialGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Vầng dương mặt trời đỏ Hường Đông thuần khiết, không viền -->
  <circle cx="256" cy="256" r="236" fill="url(#sun-grad)" filter="url(#soft-glow)"/>
</svg>
