<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffbeb">
  <title>Tải bộ favicon Hường Đông</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      place-items: center;
      color: #2c2523;
      background: #faf7f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: min(100%, 560px);
      padding: 36px 40px;
      text-align: center;
      background: #fff;
      border: 1px solid #ede5dd;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
    }
    img { width: 96px; height: 96px; }
    h1 { margin: 16px 0 0; color: #b71c1c; font-size: 24px; }
    p { color: #555; line-height: 1.6; }
    .download {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 28px;
      color: #fff;
      background: #b71c1c;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(183, 28, 28, .3);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    .alternatives { margin-top: 20px; font-size: 14px; }
    .alternatives a { color: #7f1d1d; }
    @media (hover: hover) {
      .download:hover { background: #961212; }
      .alternatives a:hover { text-decoration-thickness: 2px; }
    }
    @media (max-width: 430px) {
      body { padding: 16px; }
      main { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/favicon-192x192.png" alt="Biểu tượng mặt trời đỏ Hường Đông" width="96" height="96">
    <h1>Tải bộ favicon Hường Đông</h1>
    <p>Gói ZIP chứa favicon SVG, ICO, các kích thước PNG và đoạn khai báo dùng trong phần <code>&lt;head&gt;</code> của website.</p>
    <a class="download" href="/favicon-changes.zip" download>Tải gói ZIP</a>
    <p class="alternatives">
      Định dạng khác:
      <a href="/favicon-changes.tar.gz" download>tar.gz</a>
      · <a href="/favicon-changes.patch" download>bản vá</a>
    </p>
  </main>
</body>
</html>
