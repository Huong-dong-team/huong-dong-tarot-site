<main id="noi-dung-chinh"><article class="post-detail"><header><p class="eyebrow">{{post.dateLabel}} · {{post.author}}</p><h1>{{post.title}}</h1><p class="lead">{{post.excerpt}}</p><img src="{{post.coverImage.url}}" width="1200" height="630" alt="{{post.coverImage.alt}}"></header><div class="prose">{{{post.contentHtml}}}</div><div class="share-row"><button type="button" data-share="facebook">Facebook</button><button type="button" data-share="threads">Threads</button><button type="button" data-share="copy">Sao chép liên kết</button></div></article></main>
