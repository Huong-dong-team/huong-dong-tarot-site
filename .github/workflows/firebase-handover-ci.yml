name: firebase-handover CI

on:
  pull_request:
    paths:
      - "source/firebase-handover/**"
      - ".github/workflows/firebase-handover-ci.yml"
  push:
    branches: [main]
    paths:
      - "source/firebase-handover/**"
      - ".github/workflows/firebase-handover-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build from seed data
        run: npm run build:local

      - name: Test
        run: npm test
