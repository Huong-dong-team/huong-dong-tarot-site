name: firebase-handover CI

# Mã nguồn site nằm ở GỐC repo này, không phải source/firebase-handover như repo
# cũ. Bộ lọc paths phải theo đó, nếu không CI sẽ im lặng không chạy trên PR nào —
# đúng lỗi đã xảy ra: PR đầu tiên có 0 check vì bộ lọc còn trỏ đường dẫn cũ.
#
# archive/ và tools/ cố ý nằm ngoài: chúng không được build và không ảnh hưởng
# site, nên đổi ở đó không cần chạy lại CI.
on:
  pull_request:
    paths-ignore:
      - "archive/**"
      - "tools/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "archive/**"
      - "tools/**"
      - "**/*.md"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build from seed data
        run: npm run build:local

      - name: Test
        run: npm test
